<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hoka | Fleet Feet Vermont</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #0D1B3E;
      --navy-deep: #071020;
      --navy-mid: #142348;
      --navy-light: #1e3160;
      --accent: #4A9EFF;
      --accent-glow: rgba(74,158,255,0.18);
      --white: #ffffff;
      --muted: #7a9cc4;
      --card-bg: #111f42;
      --card-border: rgba(74,158,255,0.15);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background-color: var(--navy-deep);
      color: var(--white);
      font-family: 'Barlow', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% -10%, rgba(74,158,255,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 40% 40% at 90% 90%, rgba(13,27,62,0.8) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── HEADER ── */
    header {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 40px;
      border-bottom: 1px solid rgba(74,158,255,0.12);
      background: rgba(7,16,32,0.7);
      backdrop-filter: blur(10px);
    }
    header img {
      height: 72px;
      width: auto;
      mix-blend-mode: lighten;
      filter: brightness(1.05);
    }

    /* ── HERO ── */
    .hero {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 72px 24px 56px;
    }
    .hero-eyebrow {
      display: inline-block;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(22px, 4vw, 48px);
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 24px;
      line-height: 1.1;
    }
    .hero h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(20px, 4vw, 36px);
      font-weight: 700;
      line-height: 1.1;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--white);
      margin-bottom: 20px;
    }
    .hero h1 span { color: var(--accent); }

    /* ── CATEGORY GRID ── */
    .grid-section {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px 100px;
    }
    .brand-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 24px;
    }

    /* ── CATEGORY CARD ── */
    .brand-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    }
    .brand-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 0 40px rgba(74,158,255,0.18), 0 20px 60px rgba(0,0,0,0.5);
      border-color: rgba(74,158,255,0.4);
    }
    .brand-card:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }
    .brand-img {
      width: 100%;
      aspect-ratio: 1/1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      position: relative;
      border-radius: 16px 16px 0 0;
      overflow: hidden;
    }
    .brand-img img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 20px;
      transition: transform 0.4s ease;
    }
    .brand-card:hover .brand-img img { transform: scale(1.05); }
    .brand-info {
      padding: 18px 20px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand-name-small {
      font-size: clamp(14px, 3vw, 22px);
      font-weight: 700;
      letter-spacing: 2px;
      text-align: left;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 4px;
      word-break: break-word;
    }
    .brand-tagline {
      font-family: 'Barlow', sans-serif;
      font-size: 13px;
      font-weight: 400;
      color: var(--muted);
      line-height: 1.4;
    }
    .brand-arrow {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--accent-glow);
      border: 1px solid rgba(74,158,255,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-size: 16px;
      flex-shrink: 0;
      transition: background 0.2s, color 0.2s, transform 0.2s;
    }
    .brand-card:hover .brand-arrow {
      background: var(--accent);
      color: var(--navy-deep);
      transform: translateX(3px);
    }

    /* ── MODAL OVERLAY ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(5,12,28,0.9);
      backdrop-filter: blur(10px);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.open {
      display: flex;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* ── MODAL BOX ── */
    .modal-box {
      background: var(--navy-mid);
      border: 1px solid rgba(74,158,255,0.2);
      border-radius: 20px;
      width: 100%;
      max-width: 900px;
      max-height: 88vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      animation: slideUp 0.3s cubic-bezier(0.34,1.56,0.64,1);
      position: relative;
    }
    @keyframes slideUp {
      from { transform: translateY(24px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }
    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(255,255,255,0.08);
      border: none;
      color: var(--white);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      z-index: 10;
    }
    .modal-close:hover { background: rgba(255,255,255,0.18); }

    /* Modal header */
    .modal-header {
      padding: 32px 36px 24px;
      border-bottom: 1px solid rgba(74,158,255,0.12);
    }
    .modal-brand-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 6px;
    }
    .modal-brand-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 36px;
      font-weight: 900;
      text-transform: uppercase;
      color: var(--white);
      line-height: 1;
      margin-bottom: 8px;
    }
    .modal-brand-desc {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.6;
      max-width: 560px;
    }

    /* Mini style cards grid inside modal */
    .styles-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      padding: 28px 36px 36px;
    }

    /* ── FLIP CARD ── */
    .style-card {
      text-decoration: none;
      cursor: pointer;
      perspective: 1000px;
      aspect-ratio: 3/4;
    }
    .flip-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.55s cubic-bezier(0.45, 0.05, 0.55, 0.95);
      border-radius: 14px;
    }
    .style-card:hover .flip-inner {
      transform: rotateY(180deg);
    }
    .flip-front,
    .flip-back {
      position: absolute;
      inset: 0;
      border-radius: 14px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      overflow: hidden;
    }

    /* Front — full image */
    .flip-front {
      background: #ffffff;
    }
    .flip-front img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 20px;
    }
    .flip-front-hint {
      position: absolute;
      bottom: 10px;
      right: 10px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(74,158,255,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: #fff;
      opacity: 0.7;
      transition: opacity 0.2s;
    }
    .style-card:hover .flip-front-hint { opacity: 1; }

    /* Back — info */
    .flip-back {
      background: var(--card-bg);
      border: 1px solid rgba(74,158,255,0.2);
      transform: rotateY(180deg);
      display: flex;
      flex-direction: column;
      padding: 16px;
    }
    .style-card-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 16px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--white);
      line-height: 1.2;
      margin-bottom: 3px;
    }
    .style-card-sub {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }
    .style-stats {
      display: flex;
      flex-direction: column;
      gap: 7px;
      padding-top: 10px;
      border-top: 1px solid rgba(74,158,255,0.1);
    }
    .stat-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .stat-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
    }
    .stat-value {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--white);
      letter-spacing: 0.5px;
    }
    .style-cta-row { margin-top: auto; padding-top: 12px; }
    .style-cta {
      display: block;
      text-align: center;
      background: rgba(74,158,255,0.1);
      border: 1px solid rgba(74,158,255,0.25);
      color: var(--accent);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 9px 10px;
      border-radius: 8px;
      text-decoration: none;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    .style-card:hover .style-cta {
      background: var(--accent);
      color: var(--navy-deep);
      border-color: var(--accent);
    }

    /* ── FOOTER ── */
    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 28px 24px;
      border-top: 1px solid rgba(74,158,255,0.1);
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 1px;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 640px) {
      .brand-grid { grid-template-columns: 1fr 1fr; gap: 14px; }
      .styles-grid { grid-template-columns: 1fr 1fr; padding: 20px; gap: 12px; }
      .modal-header { padding: 28px 20px 20px; }
      .modal-brand-title { font-size: 26px; }
    }
    @media (max-width: 400px) {
      .brand-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <img src="image/FF VT Logo (1).jpg" class="logo" alt="Fleet Feet Vermont" />
  </header>

  <!-- Hero -->
  <section class="hero">
    <div class="hero-eyebrow">Hoka</div>
    <h1>Find Your<br/><span>Perfect Hoka</span></h1>
  </section>

  <!-- Category Grid -->
  <section class="grid-section">
    <div class="brand-grid" id="brandGrid"></div>
  </section>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true">
    <div class="modal-box">
      <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
      <div class="modal-header">
        <div class="modal-brand-label" id="modalLabel">Hoka</div>
        <div class="modal-brand-title" id="modalTitle"></div>
        <div class="modal-brand-desc" id="modalDesc"></div>
      </div>
      <div class="styles-grid" id="stylesGrid"></div>
    </div>
  </div>

  <footer>
    &copy; 2026 Fleet Feet Vermont 
  </footer>

<script>
  const categories = [
    {
      brand: "Neutral",
      imgSrc: "image/clifton-10.webp",
      tagline: "",
      desc: "",
      styles: [
        { name: "Clifton 10",           drop: "8mm", cushion: "Medium",  imgSrc: "image/clifton-10.webp",       url: "#" },
        { name: "Bondi 9",                drop: "5mm", cushion: "Maximum", imgSrc: "image/Bondi-9.webp",         url: "#" },
        { name: "Mach 7",                drop: "5mm", cushion: "Medium", imgSrc: "image/mach-7.webp",         url: "#" },
        
      ]
    },
    {
      brand: "Stability",
      imgSrc: "image/gaviota-6.webp",
      tagline: "",
      desc: "",
      styles: [
        { name: "Gaviota 6",       sub: "Max Support",          drop: "6mm", cushion: "Maximum", imgSrc: "image/gaviota-6.webp",  url: "#" },
        { name: "Arahi 8",         sub: "Lightweight Stability", drop: "8mm", cushion: "Medium",  imgSrc: "image/arahi-8.webp",    url: "#" },
       
      ]
    },
    {
      brand: "Trail",
      imgSrc: "image/speedgoat.webp",
      tagline: "",
      desc: "",
      styles: [
        { name: "Speedgoat 5",          drop: "5mm", cushion: "Maximum", imgSrc: "image/speedgoat.webp",      url: "#" },
        { name: "Challenger ATR 7",    drop: "8mm", cushion: "Medium",  imgSrc: "image/challenger.webp", url: "#" },
         { name: "Anacapa 2 Low GTX",  drop: "9mm", cushion: "Medium",  imgSrc: "image/anacapa-low.webp", url: "#" },
         { name: "Anacapa 2 Med GTX",  drop: "9mm", cushion: "Medium",  imgSrc: "image/anacapa-low.webp", url: "#" },
        { name: "Mafate X",       drop: "8mm", cushion: "Medium",  imgSrc: "image/mafate-x.webp",       url: "#" },
      ]
    },
    {
      brand: "Competition",
      imgSrc: "image/rocket-x 3.webp",
      tagline: "T",
      desc: "",
      styles: [
        { name: "Rocket X",      drop: "5mm", cushion: "Light", imgSrc: "image/rocket-x 3.webp",    url: "#" },
        { name: "Mach X",        drop: "5mm", cushion: "Light",  imgSrc: "image/mach X-3.webp", url: "#" },
        { name: "Crescendo MD",  drop: "0.0mm", cushion: "Light", imgSrc: "image/crescendo-md-2.webp",  url: "#" },
        { name: "Celio  X1 3.0MD",drop: "7mm", cushion: "Light", imgSrc: "image/Cielo x 3 MD.webp",  url: "#" },
      ]
      
    }
  ];

  const brandGrid = document.getElementById('brandGrid');

  categories.forEach((cat, i) => {
    const div = document.createElement('div');
    div.className = 'brand-card';
    div.dataset.index = i;
    div.tabIndex = 0;
    div.role = 'button';
    div.setAttribute('aria-label', `Browse Hoka ${cat.brand} shoes`);
    div.innerHTML = `
      <div class="brand-img">
        <img src="${cat.imgSrc}" alt="${cat.brand}" onerror="this.parentElement.innerHTML='<div style=\\'display:flex;align-items:center;justify-content:center;height:100%;font-family:Barlow Condensed,sans-serif;font-size:48px;font-weight:900;color:#0D1B3E;letter-spacing:2px;text-transform:uppercase;\\'>${cat.brand}</div>'" />
      </div>
      <div class="brand-info">
        <div>
          <div class="brand-name-small">${cat.brand}</div>
          <div class="brand-tagline">${cat.tagline}</div>
        </div>
        <div class="brand-arrow">›</div>
      </div>`;
    brandGrid.appendChild(div);
  });

  const overlay  = document.getElementById('modalOverlay');
  const closeBtn = document.getElementById('modalClose');

  function openModal(idx) {
    const cat = categories[idx];
    document.getElementById('modalLabel').textContent = 'Hoka';
    document.getElementById('modalTitle').textContent = cat.brand;
    document.getElementById('modalDesc').textContent  = '';

    const stylesGrid = document.getElementById('stylesGrid');
    stylesGrid.innerHTML = '';

    cat.styles.forEach(s => {
      const a = document.createElement('a');
      a.href = '#';
      a.className = 'style-card';
      a.innerHTML = `
        <div class="flip-inner">
          <div class="flip-front">
            <img src="${s.imgSrc}" alt="${s.name}" onerror="this.parentElement.innerHTML='<div style=\\'display:flex;align-items:center;justify-content:center;height:100%;font-family:Barlow Condensed,sans-serif;font-size:13px;font-weight:700;color:#0D1B3E;text-align:center;padding:12px;\\'>${s.name}</div>'" />
            <div class="flip-front-hint">↺</div>
          </div>
          <div class="flip-back">
            <div class="style-card-name">${s.name}</div>
            <div class="style-card-sub">${s.sub}</div>
            <div class="style-stats">
              <div class="stat-row"><span class="stat-label">Drop</span><span class="stat-value">${s.drop}</span></div>
              <div class="stat-row"><span class="stat-label">Cushion</span><span class="stat-value">${s.cushion}</span></div>
            </div>
            <div class="style-cta-row">
              <span class="style-cta">View Style</span>
            </div>
          </div>
        </div>`;
      stylesGrid.appendChild(a);
    });

    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    overlay.classList.remove('open');
    document.body.style.overflow = '';
  }

  brandGrid.addEventListener('click', e => {
    const card = e.target.closest('.brand-card');
    if (card) openModal(parseInt(card.dataset.index));
  });
  brandGrid.addEventListener('keydown', e => {
    const card = e.target.closest('.brand-card');
    if (card && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openModal(parseInt(card.dataset.index)); }
  });

  closeBtn.addEventListener('click', closeModal);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
</script>
</body>
</html>
